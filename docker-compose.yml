services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8092}:3000"
    volumes:
      - simple_kitchen_data:/app/data

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simplekitchen}
      POSTGRES_USER: ${POSTGRES_USER:-simplekitchen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - simple_kitchen_db:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simplekitchen} -d ${POSTGRES_DB:-simplekitchen}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  simple_kitchen_db:
  simple_kitchen_data:
