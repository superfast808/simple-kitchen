name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://simplekitchenprep.com
          CYCLE_START_DATE: 2025-03-15
          DELIVERY_FEE: 3.00
          NEXT_PUBLIC_DELIVERY_FEE: 3.00
          MINIMUM_ORDER_AMOUNT: 0
          NEXT_PUBLIC_MINIMUM_ORDER_AMOUNT: 0
